[package]
name = "heinrich-server"
description = "亨利输入法：常驻引擎宿主（装载词库、命名管道服务端）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
heinrich-proto.workspace = true
heinrich-core.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }

# 传输层是 Windows 命名管道，所以这个 crate 只有 Windows 形态。
# 但它仍然归 crates/：它不是注入件、产物是普通 exe，M5 换平台时只需换 pipe.rs
# （PROJECT.md D24 的判据 + §4.2 的既定点）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
