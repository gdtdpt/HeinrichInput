# 亨利 / Heinrich —— 五笔 86 版字根表（项目自有数据，手写维护）
#
# 用途：`Ctrl+Shift+1..9` 码位键位图（PROJECT.md §6.7 / D50）与 `heinrich-cli roots`。
# 它回答的是「这几个字母在键盘上属于哪个键区」，**不是**「这个字是怎么拆的」——
# 逐字拆解需要笔顺与字型数据，R3 已证伪，本文件不承担那个职责。
#
# 口径：
#   roots     主字根，共 **130** 条（86 版公开口径）。含五笔教材按字根并列列出的
#             常用偏旁（氵 扌 灬 忄 纟 讠 等），但不含「小倒立」「看头」这类
#             只在部首补充区（U+2E80–U+2EFF）或扩展 B 区（U+20000+）才有的符号
#             ——那些字形在常规字体里要么缺失、要么与常用字撞脸（`𠂇` 与「𠂇」类）。
#             它们的含义由 mnemonic（助记口诀）承担，人读得懂，机器不需要。
#   variants  同键的次要变体，不计入 130，只在键帽上以更淡的字号补充显示。
#             **所有字段都必须是任意常规字体都能画的字符**，否则键帽上会出现豆腐块。
#   primary   该键的一级简码字。它与 data/wubi86/lexicon.tsv 里「单字母码 → 字」
#             必须一一对应，这是本文件唯一可被机器硬校验的正确性来源。
#
# 校验：`heinrich-cli roots check`（五项，见 crates/heinrich-scheme/src/roots.rs）。
# 本文件只由人维护，不由 heinrich-gen 生成——字根不是从码表能推出来的。

