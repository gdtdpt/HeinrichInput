[package]
name = "heinrich-win"
description = "亨利输入法：Windows TSF 前端 DLL（不含引擎，只做注册、按键与 IPC 搬运）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# cdylib = 最终的 DLL；rlib 是为了让 `cargo test` 能编译出测试目标。
crate-type = ["cdylib", "rlib"]

[dependencies]
heinrich-tip-id.workspace = true
heinrich-log.workspace = true
# 协议 crate 是零依赖的纯字节编解码，引它不违反 D8 的意图（不给每个宿主进程
# 多背 serde/bincode）。
heinrich-proto.workspace = true
# 候选窗：几何（heinrich-ui，零依赖纯算术）+ 窗口与绘制（heinrich-win-ui，
# 自己写的另一个 crate）。两者都是我们自己维护的代码，不引入第三方运行时——
# D8 守的是「别让每个宿主进程多背别人的库」，不是「不许拆 crate」。
heinrich-ui.workspace = true
heinrich-win-ui.workspace = true

# D8 依赖纪律：注入型 DLL 只允许 windows。加任何别的库之前先想清楚
# 「每个宿主进程都要多背一份」这件事。
# `#[implement]` 生成的代码按 `windows_core::` 绝对路径引用，所以必须直接依赖它。
[dependencies.windows-core]
version = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]
