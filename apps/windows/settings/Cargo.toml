[package]
name = "heinrich-settings"
description = "亨利输入法：设置窗口（原生控件；词组 / 通用 / 学习数据）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "heinrich-settings"
path = "src/main.rs"

[dependencies]
heinrich-scheme = { workspace = true }
# 学习数据页要读 learn.db；学习分公式与 server 共用一份，不在这里抄第二遍
heinrich-core = { workspace = true }
# 窗口类名与设置程序文件名放在这个零依赖的常量 crate 里，DLL 侧用的是同一份。
heinrich-tip-id = { workspace = true }
# bundled：编进 exe，不依赖系统里的 sqlite3.dll（内网机不一定有）。代价是 exe 从
# 约 400 KB 涨到 1.5 MB 左右，换「单文件拷贝即用」，与其余产物一致。
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dependencies.windows-core]
version = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
