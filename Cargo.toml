[workspace]
resolver = "2"
members = [
    "crates/heinrich-scheme",
    "crates/heinrich-core",
    "crates/heinrich-gen",
    "crates/heinrich-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "GPL-3.0-or-later"

[workspace.dependencies]
heinrich-scheme = { path = "crates/heinrich-scheme", version = "0.1.0" }
heinrich-core = { path = "crates/heinrich-core", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
