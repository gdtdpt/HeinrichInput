[workspace]
resolver = "2"
members = [
    "crates/xizi-scheme",
    "crates/xizi-core",
    "crates/xizi-gen",
    "crates/xizi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "GPL-3.0-or-later"

[workspace.dependencies]
xizi-scheme = { path = "crates/xizi-scheme", version = "0.1.0" }
xizi-core = { path = "crates/xizi-core", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
